
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zead XO</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#101827;color:white;
font-family:Arial;text-align:center;
padding:25px 15px;
}
h1{color:#38bdf8;font-size:32px}
p{color:#cbd5e1}
.board{
display:grid;grid-template-columns:repeat(3,1fr);
gap:10px;max-width:330px;margin:25px auto;
}
.cell{
height:100px;background:#243247;border:0;
border-radius:15px;color:white;font-size:48px;
font-weight:bold;
}
button.action{
background:#0284c7;color:white;border:0;
padding:14px 25px;border-radius:12px;
font-size:18px;margin:8px;
}
#status{font-size:21px;margin:20px}
</style>
</head>
<body>
<h1>ZEAD XO ❌⭕</h1>
<p>لعبة التحدي بين الأصدقاء</p>
<div id="status">دور اللاعب X</div>
<div class="board" id="board"></div>
<button class="action" onclick="resetGame()">لعبة جديدة</button>

<script>
let cells=Array(9).fill("");
let player="X";
let finished=false;
const board=document.getElementById("board");
const status=document.getElementById("status");

function draw(){
board.innerHTML="";
cells.forEach((value,i)=>{
let b=document.createElement("button");
b.className="cell";
b.textContent=value;
b.onclick=()=>play(i);
board.appendChild(b);
});
}

function play(i){
if(cells[i]||finished)return;
cells[i]=player;
draw();
let wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];
if(wins.some(line=>line.every(x=>cells[x]===player))){
status.textContent="🏆 اللاعب "+player+" فاز!";
finished=true;
}else if(cells.every(Boolean)){
status.textContent="تعادل!";
finished=true;
}else{
player=player==="X"?"O":"X";
status.textContent="دور اللاعب "+player;
}
}
function resetGame(){
cells=Array(9).fill("");
player="X";
finished=false;
status.textContent="دور اللاعب X";
draw();
}
draw();
</script>
</body>
</html>
